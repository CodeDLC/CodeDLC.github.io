<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeDLC</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#06060a;
color:white;
overflow-x:hidden;
}

.bg{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at top,#6e35ff44,transparent 30%),
radial-gradient(circle at bottom,#4c00ff33,transparent 35%);
z-index:-1;
}

header{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
backdrop-filter:blur(20px);
background:#ffffff08;
border-bottom:1px solid #ffffff10;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo img{
width:50px;
height:50px;
border-radius:14px;
box-shadow:0 0 35px #7746ff;
}

.logo h1{
font-size:25px;
}

.accBtn{
background:#7a48ff;
border:none;
padding:12px 20px;
border-radius:14px;
cursor:pointer;
color:white;
}

.main{

padding:60px 20px;
text-align:center;
max-width:1000px;
margin:auto;
}

.heroLogo{

width:180px;
filter:drop-shadow(0 0 50px #7746ff);
animation:up 3s infinite;
}

@keyframes up{
50%{
transform:translateY(-10px)
}
}

.title{
font-size:55px;
margin-top:20px;
font-weight:800;
}

.desc{
opacity:.7;
margin-top:10px;
max-width:600px;
margin-left:auto;
margin-right:auto;
line-height:25px;
}

.download{

margin-top:30px;
background:linear-gradient(90deg,#7a48ff,#4b1dff);
padding:18px 35px;
border:none;
border-radius:20px;
font-size:18px;
color:white;
cursor:pointer;
transition:.4s;
}

.download:hover{

transform:translateY(-4px);
box-shadow:0 0 40px #7644ff;

}

.card{
margin-top:60px;
background:#ffffff07;
border-radius:30px;
padding:30px;
backdrop-filter:blur(20px);
border:1px solid #ffffff10;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
justify-content:center;
align-items:center;
background:#000000cc;
}

.window{

width:90%;
max-width:400px;
background:#0f0f15;
padding:25px;
border-radius:25px;
}

.window h2{
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
margin-top:12px;
background:#191924;
border:none;
border-radius:14px;
color:white;
}

.send{

width:100%;
margin-top:20px;
padding:15px;
background:#7945ff;
border:none;
border-radius:14px;
color:white;
cursor:pointer;

}

.change{

margin-top:15px;
opacity:.6;
text-align:center;
cursor:pointer;

}

.profile{
display:none;
}

@media(max-width:700px){

.title{
font-size:38px;
}

.heroLogo{
width:130px;
}

}

</style>
</head>
<body>

<div class="bg"></div>

<header>

<div class="logo">
<img src="icon.png">
<h1>CodeDLC</h1>
</div>

<button class="accBtn" id="openAcc">
Аккаунт
</button>

</header>

<section class="main">

<img class="heroLogo" src="icon.png">

<div class="title">
CodeDLC Client
</div>

<div class="desc">
Красивый Minecraft клиент с современным интерфейсом, функциями и удобной системой аккаунтов.
</div>

<button class="download" onclick="window.location.href='WORKUPLOAD_LINK'">
Скачать клиент
</button>

<div class="card profile" id="profile">

<h2 id="nickname"></h2>

<br>

<p>Добро пожаловать в CodeDLC</p>

<br>

<button class="download" id="logout">
Выйти
</button>

</div>

</section>


<div class="modal" id="modal">

<div class="window">

<h2 id="modeText">
Вход
</h2>

<input id="login" placeholder="Логин">

<input id="password" type="password" placeholder="Пароль">

<button class="send" id="sendBtn">
Войти
</button>

<div class="change" id="switchBtn">
Создать аккаунт
</div>

</div>

</div>

<script>

const modal=
document.getElementById("modal")

const openAcc=
document.getElementById("openAcc")

const sendBtn=
document.getElementById("sendBtn")

const switchBtn=
document.getElementById("switchBtn")

const modeText=
document.getElementById("modeText")

const profile=
document.getElementById("profile")

const nickname=
document.getElementById("nickname")

const logout=
document.getElementById("logout")

let register=false


openAcc.onclick=()=>{

modal.style.display="flex"

}


window.onclick=(e)=>{

if(e.target===modal){

modal.style.display="none"

}

}


switchBtn.onclick=()=>{

register=!register

if(register){

modeText.innerText=
"Регистрация"

sendBtn.innerText=
"Создать"

switchBtn.innerText=
"Уже есть аккаунт"

}else{

modeText.innerText=
"Вход"

sendBtn.innerText=
"Войти"

switchBtn.innerText=
"Создать аккаунт"

}

}


sendBtn.onclick=()=>{

let login=
document.getElementById("login").value

let password=
document.getElementById("password").value

if(!login||!password){

alert("Заполни поля")

return

}

let users=
JSON.parse(
localStorage.getItem("codedlcUsers")
)||[]


if(register){

if(users.find(
x=>x.login===login
)){

alert("Аккаунт уже есть")
return

}

users.push({

login:login,
password:password

})

localStorage.setItem(
"codedlcUsers",
JSON.stringify(users)
)

alert("Аккаунт создан")

return

}


let user=users.find(
x=>
x.login===login &&
x.password===password
)

if(!user){

alert("Неверный логин или пароль")

return

}

localStorage.setItem(
"codedlcCurrent",
login
)

load()

modal.style.display="none"

}


function load(){

let user=
localStorage.getItem(
"codedlcCurrent"
)

if(user){

profile.style.display=
"block"

nickname.innerText=
user

}

}

logout.onclick=()=>{

localStorage.removeItem(
"codedlcCurrent"
)

location.reload()

}

load()

</script>

</body>
</html>
