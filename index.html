<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeDLC</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050507;
color:white;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle,#7d4dff22,#000);
z-index:-1;
}

header{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
backdrop-filter:blur(15px);
background:#ffffff07;
border-bottom:1px solid #8d5dff20;
}

.logo{
display:flex;
align-items:center;
gap:15px;
}

.logo img{
width:55px;
height:55px;
border-radius:15px;
box-shadow:0 0 30px #7d4dff;
}

.logo h1{
font-size:25px;
background:linear-gradient(90deg,#a26fff,#6b30ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

nav button{
background:#7b4dff;
border:none;
padding:10px 20px;
border-radius:15px;
color:white;
cursor:pointer;
transition:.3s;
}

nav button:hover{
transform:scale(1.1);
box-shadow:0 0 30px #7d4dff;
}

.hero{
height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero img{
width:170px;
filter:drop-shadow(0 0 50px #7d4dff);
animation:float 3s infinite ease-in-out;
}

@keyframes float{
50%{
transform:translateY(-15px);
}
}

.hero h2{
font-size:60px;
margin-top:25px;
background:linear-gradient(#fff,#915cff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
opacity:.7;
margin-top:10px;
max-width:600px;
}

.download{
margin-top:30px;
padding:18px 50px;
font-size:18px;
border:none;
border-radius:18px;
background:linear-gradient(90deg,#8b57ff,#5f23ff);
color:white;
cursor:pointer;
transition:.4s;
}

.download:hover{
transform:scale(1.06);
box-shadow:0 0 40px #7d4dff;
}

.profile{
width:90%;
max-width:700px;
margin:auto;
padding:30px;
background:#ffffff08;
border-radius:25px;
backdrop-filter:blur(15px);
display:none;
margin-bottom:50px;
}

.profile img{
width:100px;
border-radius:50%;
}

.profile h3{
margin-top:10px;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000000cc;
display:none;
justify-content:center;
align-items:center;
z-index:100;
}

.box{
width:90%;
max-width:380px;
background:#111;
padding:30px;
border-radius:25px;
border:1px solid #7d4dff;
}

.box h2{
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
margin-top:10px;
border:none;
outline:none;
background:#1f1f1f;
border-radius:15px;
color:white;
}

.submit{
width:100%;
margin-top:20px;
padding:15px;
border:none;
background:#7d4dff;
border-radius:15px;
color:white;
font-size:17px;
cursor:pointer;
}

.switch{
margin-top:15px;
text-align:center;
opacity:.7;
cursor:pointer;
}

@media(max-width:700px){

.hero h2{
font-size:35px;
}

.hero img{
width:120px;
}

}
</style>
</head>

<body>

<header>

<div class="logo">
<img src="icon.png">
<h1>CodeDLC</h1>
</div>

<nav>
<button onclick="openAuth()">Аккаунт</button>
</nav>

</header>

<section class="hero">

<img src="icon.png">

<h2>CodeDLC Client</h2>

<p>
Мощный Minecraft клиент с современным дизайном и лучшими функциями.
</p>

<button class="download">
Скачать Client
</button>

</section>

<div class="profile" id="profile">

<img src="icon.png">

<h3 id="nick"></h3>

<p>Премиум пользователь CodeDLC</p>

<br>

<button class="download" onclick="logout()">
Выйти
</button>

</div>

<div class="modal" id="modal">

<div class="box">

<h2 id="title">
Вход
</h2>

<input placeholder="Логин" id="user">

<input placeholder="Пароль" type="password" id="pass">

<button class="submit" onclick="login()" id="btn">
Войти
</button>

<div class="switch" onclick="switchMode()" id="switch">
Нет аккаунта? Регистрация
</div>

</div>

</div>

<script>

let reg=false

function openAuth(){
modal.style.display="flex"
}

window.onclick=(e)=>{

if(e.target==modal){
modal.style.display="none"
}

}

function switchMode(){

reg=!reg

if(reg){

title.innerText="Регистрация"
btn.innerText="Создать аккаунт"
switch.innerText="Уже есть аккаунт?"

}else{

title.innerText="Вход"
btn.innerText="Войти"
switch.innerText="Нет аккаунта? Регистрация"

}

}

function login(){

let u=user.value
let p=pass.value

if(!u||!p)return

let users=
JSON.parse(localStorage.getItem("users"))||[]

if(reg){

if(users.find(x=>x.name==u)){

alert("Аккаунт существует")
return

}

users.push({
name:u,
pass:p
})

localStorage.setItem(
"users",
JSON.stringify(users)
)

alert("Успешно")

}else{

let ok=users.find(
x=>x.name==u&&x.pass==p
)

if(!ok){

alert("Неверные данные")
return
}

localStorage.setItem(
"user",
u
)

loadProfile()

}

}

function loadProfile(){

let u=
localStorage.getItem("user")

if(u){

profile.style.display="block"

nick.innerText=u

modal.style.display="none"

}

}

function logout(){

localStorage.removeItem("user")

location.reload()

}

loadProfile()

</script>

</body>
</html>
