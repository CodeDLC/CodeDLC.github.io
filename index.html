<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeDLC</title>

<style>
:root{
  --bg1:#0b0614;
  --bg2:#120a24;
  --glass:rgba(255,255,255,0.06);
  --glass2:rgba(255,255,255,0.10);
  --accent:#b026ff;
  --accent2:#6a00ff;
  --text:#e7ddff;
  --border:rgba(176,38,255,0.4);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, sans-serif;
}

body{
  background:radial-gradient(circle at top, var(--bg2), var(--bg1));
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

header{
  text-align:center;
  padding:30px 15px;
}

.logo{
  font-size:28px;
  font-weight:700;
  letter-spacing:3px;
  color:var(--accent);
}

.container{
  display:grid;
  grid-template-columns:1fr 320px;
  gap:20px;
  padding:20px;
}

@media(max-width:900px){
  .container{
    grid-template-columns:1fr;
  }
}

.glass{
  background:var(--glass);
  border:1px solid var(--border);
  backdrop-filter:blur(14px);
  border-radius:14px;
  padding:15px;
  box-shadow:0 0 30px rgba(0,0,0,0.4);
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  transition:.3s;
  font-weight:600;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 0 20px rgba(176,38,255,0.4);
}

input{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(0,0,0,0.3);
  color:white;
  outline:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;
}

.item{
  padding:12px;
  text-align:center;
  border-radius:12px;
  background:var(--glass);
  border:1px solid var(--border);
  cursor:pointer;
  transition:.3s;
}

.item:hover{
  background:var(--glass2);
  transform:scale(1.05);
}

.hidden{
  display:none;
}

.toast{
  position:fixed;
  right:20px;
  top:20px;
  padding:12px 18px;
  background:rgba(176,38,255,0.9);
  color:white;
  border-radius:12px;
  display:none;
}

.sidebar{
  position:sticky;
  top:20px;
}

.small{
  font-size:13px;
  opacity:.8;
}

</style>
</head>

<body>

<div class="toast" id="toast"></div>

<header>
  <div class="logo">CodeDLC</div>
  <div class="small">glass UI / dark purple build</div>
</header>

<div class="container">

<div>

<div class="glass">
  <h3>Скачать</h3>
  <button onclick="download()">Скачать чит</button>
  <div class="small">Скачиваний: <span id="dl">0</span></div>
</div>

<div class="glass">
  <h3>Авторизация</h3>
  <input id="email" placeholder="email">
  <input id="pass" type="password" placeholder="password">
  <button onclick="login()">Войти</button>

  <hr style="margin:10px 0;border:1px solid rgba(255,255,255,0.1)">

  <input id="regEmail" placeholder="рег email">
  <input id="regPass" type="password" placeholder="рег пароль">
  <button onclick="register()">Регистрация</button>
</div>

<div class="glass hidden" id="cab">

  <h3>Кабинет</h3>
  <div id="nickView">Nick: Player</div>
  <input id="nick" placeholder="смена ника">
  <button onclick="saveNick()">Сохранить</button>

  <div id="sub"></div>

  <button onclick="extend()">Продлить +30 дней</button>
  <button onclick="inject()">Inject</button>

</div>

<div class="glass">
  <h3>Функции</h3>
  <div class="grid">
    <div class="item">X-Ray</div>
    <div class="item">Fly</div>
    <div class="item">Speed</div>
    <div class="item">Aimbot</div>
    <div class="item">ESP</div>
    <div class="item">NoFall</div>
  </div>
</div>

</div>

<div class="sidebar">

<div class="glass">
  <h3>Лог</h3>
  <div id="log"></div>
</div>

</div>

</div>

<script>

let dl = localStorage.getItem("dl")||0
dlView()

function dlView(){
  document.getElementById("dl").innerText = dl
}

function download(){
  dl++
  localStorage.setItem("dl",dl)
  dlView()

  let blob = new Blob(["CodeDLC test file"],{type:"text/plain"})
  let a = document.createElement("a")
  a.href = URL.createObjectURL(blob)
  a.download="CodeDLC.jar"
  a.click()

  log("download")
}

function register(){
  let users = JSON.parse(localStorage.getItem("users")||"[]")
  users.push({
    e:regEmail.value,
    p:btoa(regPass.value+"salt"),
    sub:Date.now()+2592000000,
    nick:"Player"
  })
  localStorage.setItem("users",JSON.stringify(users))
  alert("ok")
}

function login(){
  let users = JSON.parse(localStorage.getItem("users")||"[]")
  let u = users.find(x=>x.e==email.value && x.p==btoa(pass.value+"salt"))
  if(!u) return alert("error")

  localStorage.setItem("session",u.e)
  show()
  log("login")
}

function show(){
  cab.classList.remove("hidden")
  let users = JSON.parse(localStorage.getItem("users"))
  let s = localStorage.getItem("session")
  let u = users.find(x=>x.e==s)

  sub.innerText = "sub: "+new Date(u.sub).toLocaleDateString()
}

function saveNick(){
  let users = JSON.parse(localStorage.getItem("users"))
  let s = localStorage.getItem("session")
  let u = users.find(x=>x.e==s)
  u.nick = nick.value
  localStorage.setItem("users",JSON.stringify(users))
}

function extend(){
  let users = JSON.parse(localStorage.getItem("users"))
  let s = localStorage.getItem("session")
  let u = users.find(x=>x.e==s)
  u.sub += 2592000000
  localStorage.setItem("users",JSON.stringify(users))
  show()
}

function inject(){
  toast("Injected")
  log("inject")
}

function toast(t){
  let el = document.getElementById("toast")
  el.innerText = t
  el.style.display="block"
  setTimeout(()=>el.style.display="none",2000)
}

function log(t){
  let l = document.getElementById("log")
  l.innerHTML = "<div>"+t+"</div>" + l.innerHTML
}

if(localStorage.getItem("session")) show()

</script>

</body>
</html>
