<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CodeDLC</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:'Montserrat',sans-serif;

    background:#050507;

    color:white;

    overflow-x:hidden;

}

/* BACKGROUND */

.bg{

    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top left,
    rgba(140,82,255,.35),
    transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(124,58,237,.25),
    transparent 35%),

    #050507;

    z-index:-5;

}

.grid{

    position:fixed;
    inset:0;

    background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);

    background-size:40px 40px;

    z-index:-4;

}

/* NAVBAR */

nav{

    width:100%;

    height:92px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:
    rgba(7,7,10,.72);

    backdrop-filter:blur(22px);

    border-bottom:
    1px solid rgba(255,255,255,.05);

    position:fixed;

    top:0;
    left:0;

    z-index:999;

}

/* LOGO */

.logo{

    display:flex;

    align-items:center;

    gap:14px;

}

.logo img{

    width:58px;
    height:58px;

    border-radius:18px;

    object-fit:cover;

    box-shadow:
    0 0 35px rgba(140,82,255,.45);

}

.logo span{

    font-size:34px;

    font-weight:900;

    color:#9d6bff;

    text-shadow:
    0 0 30px rgba(140,82,255,.5);

}

/* LANGUAGE */

.lang-box{

    display:flex;

    gap:10px;

}

.lang-btn{

    width:65px;
    height:65px;

    border:none;

    border-radius:22px;

    background:
    rgba(255,255,255,.05);

    border:
    1px solid rgba(255,255,255,.06);

    color:white;

    font-size:22px;

    font-weight:900;

    cursor:pointer;

    transition:.3s;

}

.lang-btn:hover{

    transform:translateY(-4px);

}

.lang-btn.active{

    background:
    linear-gradient(
    135deg,
    #a970ff,
    #6d28d9);

    box-shadow:
    0 0 35px rgba(140,82,255,.6);

}

/* HERO */

.hero{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:
    150px 20px
    120px;

}

.hero-content{

    width:100%;
    max-width:900px;

}

/* HERO LOGO */

.hero-logo{

    width:190px;
    height:190px;

    margin:
    0 auto 40px;

    padding:15px;

    border-radius:42px;

    background:
    rgba(255,255,255,.05);

    backdrop-filter:blur(20px);

    border:
    1px solid rgba(255,255,255,.08);

    animation:float 4s ease-in-out infinite;

    box-shadow:
    0 0 60px rgba(140,82,255,.15);

}

.hero-logo img{

    width:100%;
    height:100%;

    border-radius:30px;

    object-fit:cover;

}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* VERSION */

.version{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    padding:18px 38px;

    border-radius:999px;

    background:
    rgba(255,255,255,.05);

    border:
    1px solid rgba(255,255,255,.07);

    margin-bottom:40px;

    font-size:20px;

    font-weight:800;

    backdrop-filter:blur(20px);

}

/* TITLE */

.hero h1{

    font-size:
    clamp(72px,15vw,170px);

    line-height:.9;

    font-weight:900;

    margin-bottom:35px;

    background:
    linear-gradient(
    180deg,
    #ffffff,
    #9d6bff);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
    0 0 45px rgba(140,82,255,.45);

}

/* TEXT */

.hero p{

    color:#d7d7d7;

    font-size:24px;

    line-height:1.8;

    font-weight:700;

}

/* BUTTONS */

.buttons{

    margin-top:60px;

    display:flex;

    flex-direction:column;

    gap:20px;

}

/* BUTTON */

.btn{

    width:100%;

    height:90px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    border-radius:32px;

    font-size:25px;

    font-weight:900;

    transition:.35s;

}

/* DOWNLOAD */

.btn-download{

    background:
    linear-gradient(
    135deg,
    #b279ff,
    #6d28d9);

    color:white;

    box-shadow:
    0 0 45px rgba(140,82,255,.45);

}

.btn-download:hover{

    transform:
    translateY(-6px)
    scale(1.02);

    box-shadow:
    0 0 75px rgba(140,82,255,.7);

}

/* TELEGRAM */

.btn-tg{

    background:
    rgba(255,255,255,.05);

    border:
    1px solid rgba(255,255,255,.07);

    backdrop-filter:blur(20px);

    color:white;

}

.btn-tg:hover{

    transform:translateY(-6px);

    border-color:#9d6bff;

    box-shadow:
    0 0 35px rgba(140,82,255,.25);

}

/* FOOTER */

footer{

    position:fixed;

    bottom:0;
    left:0;

    width:100%;

    height:55px;

    padding:0 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
    rgba(8,8,12,.72);

    backdrop-filter:blur(18px);

    border-top:
    1px solid rgba(255,255,255,.05);

    z-index:9999;

}

/* FOOTER LEFT */

.footer-left{

    color:#7a7a7a;

    font-size:14px;

    font-weight:700;

    letter-spacing:.5px;

}

/* FOOTER RIGHT */

.footer-right{

    color:#7a7a7a;

    font-size:14px;

    font-weight:700;

    letter-spacing:.5px;

}

/* MOBILE httpsmedia(max-width:700px){

    nav{

        height:84px;

        padding:0 14px;

    }

    .logo span{

        font-size:26px;

    }

    .logo img{

        width:50px;
        height:50px;

    }

    .lang-btn{

        width:58px;
        height:58px;

        font-size:20px;

        border-radius:18px;

    }

    .hero-logo{

        width:145px;
        height:145px;

    }

    .hero p{

        font-size:19px;

    }

    .btn{

        height:84px;

        font-size:22px;

    }

}

</style>

</head>
<body>

<div class="bg"></div>
<div class="grid"></div>

<!-- NAVBAR -->

<nav>

<div class="logo">

<img src="icon.png">

<span>CodeDLC</span>

</div>

<div class="lang-box">

<button class="lang-btn active"
id="ruBtn"
onclick="setLang('ru')">
RU
</button>

<button class="lang-btn"
id="enBtn"
onclick="setLang('en')">
EN
</button>

</div>

</nav>

<!-- HERO -->

<section class="hero">

<div class="hero-content">

<div class="hero-logo">

<img src="icon.png">

</div>

<div class="version">
CodeDLC - 1.21.4
</div>

<h1>
CodeDLC
</h1>

<p id="heroText">
Лучший бесплатный клиент на 1.21.4 с обходами на крупные сервера и с лучшей оптимизацией.
</p>

<div class="buttons">

<a href="https://workupload.com/file/Pv7ysptBdYz"
target="_blank"
class="btn btn-download"
id="downloadText">
Скачать
</a>

<a href="https://t.me/CodeDLC0"
target="_blank"
class="btn btn-tg"
id="telegramText">
Telegram
</a>

</div>

</div>

</section>

<!-- FOOTER -->

<footer>

<div class="footer-left">
CodeDLC - 1.21.4
</div>

<div class="footer-right">
v1.4.0
</div>

</footer>

<script>

function setLang(lang){

    const ruBtn =
    document.getElementById("ruBtn");

    const enBtn =
    document.getElementById("enBtn");

    ruBtn.classList.remove("active");
    enBtn.classList.remove("active");

    if(lang === "ru"){

        ruBtn.classList.add("active");

        document.getElementById("heroText").innerText =
        "Лучший бесплатный клиент на 1.21.4 с обходами на крупные сервера и с лучшей оптимизацией.";

        document.getElementById("downloadText").innerText =
        "Скачать";

        document.getElementById("telegramText").innerText =
        "Telegram";

        document.documentElement.lang = "ru";

    }

    if(lang === "en"){

        enBtn.classList.add("active");

        document.getElementById("heroText").innerText =
        "The best free client for 1.21.4 with bypasses on large servers and the best optimization.";

        document.getElementById("downloadText").innerText =
        "Download";

        document.getElementById("telegramText").innerText =
        "Telegram";

        document.documentElement.lang = "en";

    }

}

</script>

</body>
</html>
